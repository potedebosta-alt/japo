<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="titulo-icone">
  <title id="titulo-icone">かな — Hiragana e Katakana</title>

  <!-- Fundo sangrando até a borda: um ícone maskable não pode ter canto transparente. -->
  <rect width="512" height="512" fill="#faf8f4"/>
  <!-- Placa de cantos arredondados generosos, o formato visível do ícone. -->
  <rect x="14" y="14" width="484" height="484" rx="108" ry="108" fill="#f4ecdf"/>

  <!-- か desenhado à mão em curvas: nada de <text>, para não depender de
       nenhuma fonte japonesa instalada no aparelho.
       O grupo cresce a partir do centro e deixa ~20% de margem em volta,
       que é a zona segura exigida pelos ícones maskable. -->
  <g transform="translate(256 256) scale(1.3) translate(-256 -256)"
     fill="none" stroke="#c4553d" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(4.5 -5)">
      <!-- 1º traço: barra horizontal, dobra para baixo e fecha com o gancho. -->
      <path d="M168 216 L296 202 C320 206 320 250 302 296 C286 336 260 358 230 352" stroke-width="26"/>
      <!-- 2º traço: a diagonal longa que cruza a barra e cai para a esquerda. -->
      <path d="M214 158 C208 196 202 240 192 282 C184 316 172 344 152 364" stroke-width="26"/>
      <!-- 3º traço: o pingo inclinado do canto superior direito. -->
      <path d="M326 166 C340 186 350 206 352 234" stroke-width="24"/>
    </g>
  </g>
</svg>
